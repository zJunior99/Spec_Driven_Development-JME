openapi: 3.0.3
info:
  title: Payments API
  version: 1.0.0
  description: API de procesamiento de pagos para tienda en línea

paths:
  /payments:
    post:
      summary: Crear un nuevo pago
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Pago creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/{id}:
    get:
      summary: Consultar un pago por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pago encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          description: Pago no encontrado

  /payments/{id}/cancel:
    post:
      summary: Cancelar un pago pendiente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pago cancelado
        '409':
          description: El pago no puede cancelarse en su estado actual

components:
  schemas:
    CreatePaymentRequest:
      type: object
      required: [order_id, amount, currency]
      properties:
        order_id:
          type: string
        amount:
          type: number
          minimum: 0.01
        currency:
          type: string
          enum: [USD, PEN, EUR]

    Payment:
      type: object
      properties:
        id:
          type: string
        order_id:
          type: string
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [pending, completed, cancelled, failed]
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
